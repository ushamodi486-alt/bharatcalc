<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>BharatCalc — India's Smart Calculator Hub</title>
<meta name="description" content="BharatCalc — India's Smart Calculator Hub. 50+ calculators: EMI, SIP, GST, Income Tax, BMI, Age, Unit & Currency conversion and more, in English and Hindi.">
<meta name="theme-color" content="#F3F4FA">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body data-theme="light" data-color="blue">
<div id="glowSetter" class="app">

  <!-- Top bar -->
  <div class="topbar">
    <div class="brand"><span class="brand-dot"></span> BharatCalc</div>
    <div class="topbar-actions">
      <button class="icon-btn" id="voiceBtn" aria-label="Voice input" title="Voice input">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </button>
    </div>
  </div>

  <!-- Mode switcher (Basic / Scientific / Tools) -->
  <div class="mode-switch">
    <button data-mode="basic" data-i18n="basic">Basic</button>
    <button data-mode="scientific" data-i18n="scientific">Scientific</button>
    <button data-mode="tools" data-i18n="tools">Tools</button>
  </div>

  <!-- BASIC + SCIENTIFIC VIEW (one shared display/keypad; scientific just adds the top row) -->
  <div class="view" id="view-basic">
    <div class="display-card">
      <div class="memory-badge" id="memBadge">M</div>
      <div class="expr-trail" id="exprTrail">0</div>
      <div class="result" id="resultDisplay">0</div>
    </div>
    <div class="sci-toggle-row" id="sciRow" style="display:none"></div>
    <div class="keypad" id="keypad"></div>
  </div>
  <div class="view" id="view-scientific">
  </div>

  <!-- TOOLS GRID -->
  <div class="view" id="view-tools">
    <div class="search-box">
      <input type="text" id="toolSearch" placeholder="Search tools…">
    </div>
    <div class="chip-row" id="catChips"></div>
    <div id="toolSections"></div>
  </div>

  <!-- TOOL PANEL (opens over Tools view) -->
  <div class="tool-panel" id="toolPanel">
    <div class="tool-panel-header">
      <button class="back-btn" id="backBtn" aria-label="Back">←</button>
      <div class="tool-panel-title" id="toolPanelTitle">Tool</div>
      <button class="icon-btn" id="toolFavBtn" style="margin-left:auto" aria-label="Favorite">☆</button>
    </div>
    <div id="toolBody"></div>
  </div>

  <!-- HISTORY VIEW -->
  <div class="view" id="view-history">
    <div class="search-box">
      <input type="text" id="historySearch" placeholder="Search history…">
    </div>
    <div class="action-row" style="margin-bottom:4px">
      <button class="pill-btn" id="exportCsvBtn" data-i18n="exportCsv">Export CSV</button>
      <button class="pill-btn" id="exportPdfBtn" data-i18n="exportPdf">Export PDF</button>
      <button class="pill-btn" id="clearHistoryBtn" data-i18n="clearHistory">Clear</button>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>

  <!-- Bottom nav -->
  <div class="bottom-nav">
    <button class="nav-btn" data-mode="basic">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg>
      <span data-i18n="basic">Basic</span>
    </button>
    <button class="nav-btn" data-mode="scientific">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3H5a2 2 0 00-2 2v4m6-6h10a2 2 0 012 2v4M3 9v10a2 2 0 002 2h4m-6-12h18m-6 12h4a2 2 0 002-2V9"/></svg>
      <span data-i18n="scientific">Sci</span>
    </button>
    <button class="nav-btn" data-mode="tools">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg>
      <span data-i18n="tools">Tools</span>
    </button>
    <button class="nav-btn" data-mode="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 106 5.3L3 8"/><path d="M12 7v5l4 2"/></svg>
      <span data-i18n="history">History</span>
    </button>
  </div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Settings sheet -->
<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="sheet" id="settingsSheet">
  <h3 data-i18n="settings">Settings</h3>
  <div class="setting-row">
    <span class="setting-label" data-i18n="darkMode">Dark mode</span>
    <button class="toggle" id="darkToggle"></button>
  </div>
  <div class="setting-row">
    <span class="setting-label" data-i18n="language">Language (English / हिंदी)</span>
    <button class="toggle" id="langToggle"></button>
  </div>
  <div class="setting-row">
    <span class="setting-label">Accent color</span>
    <div class="swatches">
      <span class="swatch" data-color="blue" style="background:#2F6FED"></span>
      <span class="swatch" data-color="orange" style="background:#FF8A1E"></span>
      <span class="swatch" data-color="teal" style="background:#0EA5A5"></span>
      <span class="swatch" data-color="indigo" style="background:#4F46E5"></span>
    </div>
  </div>
  <div class="menu-row" id="shareAppBtn">📤 <span data-i18n="shareApp">Share App</span></div>
  <div class="menu-row" id="rateUsBtn">⭐ <span data-i18n="rateUs">Rate Us</span></div>
  <div class="menu-row" id="contactUsBtn">✉️ <span data-i18n="contactUs">Contact Us</span></div>
  <div class="menu-row" id="aboutUsBtn">ℹ️ <span data-i18n="aboutUs">About Us</span></div>
  <div class="menu-row" id="privacyBtn">🔒 <span data-i18n="privacyPolicy">Privacy Policy</span></div>
  <div class="menu-row" id="termsBtn">📄 <span data-i18n="terms">Terms &amp; Conditions</span></div>
</div>

<!-- Info sheet (About / Privacy / Terms static content) -->
<div class="sheet-backdrop" id="infoBackdrop"></div>
<div class="sheet" id="infoSheet">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
    <h3 id="infoSheetTitle" style="margin:0">Info</h3>
    <button class="icon-btn" id="infoCloseBtn" aria-label="Close">✕</button>
  </div>
  <div id="infoSheetBody" style="font-size:13.5px;line-height:1.7;color:var(--text-dim)"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="./script.js"></script>
</body>
</html>
